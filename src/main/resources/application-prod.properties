# -------------------------------------------------------------
# Production Server
# -------------------------------------------------------------
server.port=8080

# CORS: list only trusted web origins (no localhost wildcards in prod)
app.api.cors.enabled=true
# Comma-separated exact origins, e.g. https://weighment.suguna.com,https://admin.suguna.com
app.api.cors.allowed-origins=
app.api.cors.allow-credentials=true

# -------------------------------------------------------------
# Oracle Database Connection
# -------------------------------------------------------------
# Oracle Production DB Connection
spring.datasource.url=jdbc:oracle:thin:@10.4.1.25:1541/PROD
spring.datasource.username=apps
spring.datasource.password=sugapps

# Use modern Oracle driver class
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# -------------------------------------------------------------
# JPA
# -------------------------------------------------------------
# Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.data.jdbc.repositories.enabled=false

# -------------------------------------------------------------
# Spring Boot Admin Client
# -------------------------------------------------------------
spring.boot.admin.client.enabled=true
spring.boot.admin.client.instance.service-base-url=http://10.5.1.136:8080/
spring.boot.admin.client.url=http://10.5.1.136:8080/admin

# -------------------------------------------------------------
# File Paths
# -------------------------------------------------------------
file.upload-dir=/home/weighment
file.weighment-verification-dir=/home/weighment


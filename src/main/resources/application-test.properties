# -------------------------------------------------------------
# Test Server
# -------------------------------------------------------------
server.port=8080

# CORS for local web / emulator / Flutter web hitting this API
app.api.cors.enabled=true
app.api.cors.allowed-origin-patterns=http://localhost:*
app.api.cors.allow-credentials=true

# -------------------------------------------------------------
# Spring Boot Admin Client
# -------------------------------------------------------------
spring.boot.admin.client.enabled=true
spring.boot.admin.client.instance.service-base-url=http://10.5.1.227:8080/
spring.boot.admin.client.url=http://10.5.1.227:8080/admin

# -------------------------------------------------------------
# Oracle Database Connection
# -------------------------------------------------------------
# Oracle TEST DB Connection
spring.datasource.url=jdbc:oracle:thin:@10.4.1.49:1530/TEST
spring.datasource.username=apps
spring.datasource.password=sugapps

# Use modern Oracle driver class
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# -------------------------------------------------------------
# JPA
# -------------------------------------------------------------
# Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.data.jdbc.repositories.enabled=false

# Log APPS.sug_mai_birds_lifting_pkg procedures on startup (check application log)
app.oracle.lifting.introspect-on-startup=true

# -------------------------------------------------------------
# File Paths (UAT / TEST server same /home layout as prod /home/weighment)
# -------------------------------------------------------------
file.upload-dir=/home/weighment-test/verification
file.weighment-verification-dir=/home/weighment-test/verification


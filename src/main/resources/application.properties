# -------------------------------------------------------------
# Application Info
# -------------------------------------------------------------
spring.application.name=weighment-api-service
spring.profiles.active=test

# JWT-only API: do not create default Spring Security user/password
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# -------------------------------------------------------------
# API response envelope (CommonApiResponse / GlobalExceptionHandler)
# -------------------------------------------------------------
app.api.response.include-path=false
app.api.response.include-timestamp=true
app.api.response.mask-internal-errors=true

# -------------------------------------------------------------
# HikariCP Connection Pool
# -------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.pool-name=${spring.application.name}-hikari

# -------------------------------------------------------------
# JPA
# -------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# JWT Security
# -------------------------------------------------------------
#security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.secret-key=UUv4PiodwWQm7a5/7aQfeHPJWTdxyi92Ss7/EwcWxEw=
security.jwt.expiration-time=28800000
security.jwt.refresh-expiration-time=7776000000

# -------------------------------------------------------------
# Oracle ERP (sug_mai_birds_lifting_pkg + lifting/weighment tables)
# -------------------------------------------------------------
app.oracle.erp.application-code=BRO-WEIGHMENT
app.oracle.erp.default-geofence-radius-meters=200
app.oracle.erp.schedule-list-lookback-days=90
app.oracle.erp.retail-lifting-source=RETAIL
app.oracle.erp.retail-otp-validation-enabled=true
# Shop OTP on SUG_MAI_RETAIL_ORDER_DTL (RETAIL_OTP, OTP_EXPIRES_AT, OTP_VERIFIED) — enable after DDL
app.oracle.erp.retail-order-otp-use-dtl-column=false
app.oracle.erp.retail-order-otp-column=RETAIL_OTP
app.oracle.erp.retail-order-otp-expires-column=OTP_EXPIRES_AT
app.oracle.erp.retail-order-otp-verified-column=OTP_VERIFIED
# Retail customer: OE order ship-to → HZ (account_number, party_name, site location, site flex GPS)
app.oracle.erp.retail-customer-from-hz-site-enabled=true
app.oracle.erp.retail-customer-site-use-code=SHIP_TO
# Shop GPS from hz_cust_acct_sites_all flex attributes (attribute10=lon, attribute11=lat on TEST)
app.oracle.erp.retail-customer-gps-enabled=true
app.oracle.erp.retail-customer-latitude-column=ATTRIBUTE11
app.oracle.erp.retail-customer-longitude-column=ATTRIBUTE10
# Per retail order line on SUG_MAI_RETAIL_ORDER_DTL — see document/retail-order-delivery-start-ddl.sql
app.oracle.erp.oracle-apps-schema=APPS
app.oracle.erp.oracle-sug-schema=SUG
app.oracle.erp.retail-order-hdr-table=SUG_MAI_RETAIL_ORDER_HDR
app.oracle.erp.retail-order-dtl-table=SUG_MAI_RETAIL_ORDER_DTL
app.oracle.erp.retail-order-delivery-start-enabled=true
app.oracle.erp.retail-order-delivery-status-enabled=true
app.oracle.erp.retail-order-delivery-status-column=DELV_STATUS
app.oracle.erp.retail-order-delivery-started-date-column=DELV_START_DT
app.oracle.erp.retail-order-delivery-completed-date-column=DELV_END_DT
app.oracle.erp.retail-order-delivery-require-start=true
# 0 = no date filter on list. When >0, list includes rows with order_request_date in last N days (NULL date still included).
app.oracle.lifting.package-name=sug_mai_birds_lifting_pkg
app.oracle.lifting.schema-name=APPS
app.oracle.lifting.introspect-on-startup=false
# Keep false for mobile: get_order_status on every start is slow (package introspection + ERP call)
app.oracle.lifting.invoke-order-status-on-start=false

# -------------------------------------------------------------
# File Paths
# -------------------------------------------------------------
file.upload.base-path=${user.home}/weighment
file.upload-dir=${file.upload.base-path}/verification
# Weighment evidence (vehicle, shop, signature)
file.weighment-verification-dir=
file.banner-dir=
pdf.file.path=

# Upload size limits (paths above)
app.weighment.upload.max-image-bytes=5242880
# Legacy path key — use file.upload-dir in new environments
app.weighment.upload.base-dir=
# Must be >= app.weighment.upload.max-image-bytes (Spring rejects multipart before the controller otherwise)
spring.servlet.multipart.max-file-size=5242880
spring.servlet.multipart.max-request-size=15728640

# -------------------------------------------------------------
# Swagger
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Disable OpenAPI docs
springdoc.api-docs.enabled=true

# Disable Swagger UI
springdoc.swagger-ui.enabled=true

# -------------------------------------------------------------
# Actuator
# -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

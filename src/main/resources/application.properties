# -------------------------------------------------------------
# Application Info
# -------------------------------------------------------------
spring.application.name=weighment-api-service
spring.profiles.active=test

# -------------------------------------------------------------
# API response envelope (CommonApiResponse / GlobalExceptionHandler)
# -------------------------------------------------------------
app.api.response.include-path=false
app.api.response.include-timestamp=true
app.api.response.mask-internal-errors=true

# -------------------------------------------------------------
# HikariCP Connection Pool
# -------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.pool-name=${spring.application.name}-hikari

# -------------------------------------------------------------
# JPA
# -------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# JWT Security
# -------------------------------------------------------------
#security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.secret-key=UUv4PiodwWQm7a5/7aQfeHPJWTdxyi92Ss7/EwcWxEw=
security.jwt.expiration-time=28800000
security.jwt.refresh-expiration-time=7776000000

# -------------------------------------------------------------
# Device login seed (replace with ERP device mapping)
# -------------------------------------------------------------
app.auth.devices[0].device-id=DEV-SAMPLE-001
app.auth.devices[0].enabled=true
app.auth.devices[0].authorized=true
app.auth.devices[0].supervisor-id=SUP-1024
app.auth.devices[0].supervisor-code=WS1024
app.auth.devices[0].supervisor-name=Ravi Kumar
app.auth.devices[0].supervisor-mobile=9876543210
app.auth.devices[0].branch-id=BR-12
app.auth.devices[0].branch-name=Coimbatore
app.auth.devices[0].supervisor-active=true

# -------------------------------------------------------------
# Swagger
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Disable OpenAPI docs
springdoc.api-docs.enabled=true

# Disable Swagger UI
springdoc.swagger-ui.enabled=true

# -------------------------------------------------------------
# Actuator
# -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

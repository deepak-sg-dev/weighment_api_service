# -------------------------------------------------------------
# Application Info
# -------------------------------------------------------------
spring.application.name=weighment-api-service
spring.profiles.active=test

# JWT-only API: do not create default Spring Security user/password
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# -------------------------------------------------------------
# API response envelope (CommonApiResponse / GlobalExceptionHandler)
# -------------------------------------------------------------
app.api.response.include-path=false
app.api.response.include-timestamp=true
app.api.response.mask-internal-errors=true

# CORS (browser / Flutter web). Native mobile HTTP is not subject to CORS.
# Enable per profile; use allowed-origin-patterns for localhost ports in dev.
app.api.cors.enabled=true
app.api.cors.allowed-origin-patterns=http://127.0.0.1:*,http://localhost:*
# app.api.cors.allowed-origins=
# app.api.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
# app.api.cors.allowed-headers=*
# app.api.cors.exposed-headers=Authorization
# app.api.cors.allow-credentials=true
# app.api.cors.max-age-seconds=3600

# -------------------------------------------------------------
# HikariCP Connection Pool
# -------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.pool-name=${spring.application.name}-hikari
# Avoid Oracle default fetch of 10 rows on schedule list / retail batch queries
spring.jdbc.template.fetch-size=100

# -------------------------------------------------------------
# JPA
# -------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# JWT Security
# -------------------------------------------------------------
#security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.secret-key=UUv4PiodwWQm7a5/7aQfeHPJWTdxyi92Ss7/EwcWxEw=
security.jwt.expiration-time=28800000
security.jwt.refresh-expiration-time=7776000000

# -------------------------------------------------------------
# Oracle ERP (sug_mai_birds_lifting_pkg + lifting/weighment tables)
# -------------------------------------------------------------
app.oracle.erp.application-code=BRO-WEIGHMENT
# SUG_MAI_WEIGHMENT_IMAGE_REF.APPLICATION (separate from lifting NVL(application,...))
app.oracle.erp.weighment-image-ref-application-code=WMT_APP
app.oracle.erp.default-geofence-radius-meters=200
app.oracle.erp.schedule-list-lookback-days=30
app.oracle.erp.retail-lifting-source=RETAIL
app.oracle.erp.retail-otp-validation-enabled=true
# Until RETAIL_OTP is populated in ERP: fixed shop OTP for schedule + submit validation
app.oracle.erp.retail-otp-stub-code=1234
# Link lifting HDR: OE_PO_CHAIN (oe line attribute2 + PO req) required when HDR has no indent key.
# SUG_RETAIL_TABLES: HDR/DTL only (fast; needs req_header_id/header_id = erpindentid or mobile_order_no).
app.oracle.erp.retail-order-link-mode=OE_PO_CHAIN
app.oracle.erp.retail-hdr-lifting-match-column=REQ_HEADER_ID
app.oracle.erp.retail-po-requisition-join-trim=false
# HZ: name/address/GPS per orders[].customerCode (rod.customer_code hp_ord), not lifting cus_name.
# OE header ship-to (csu/hcas) is GPS/address fallback only when line ship-to has no coords.
app.oracle.erp.retail-customer-from-hz-site-enabled=true
app.oracle.erp.retail-customer-site-use-code=SHIP_TO
# Retail DTL / weighment DTL columns: OracleErpColumns + document/*-ddl.sql
# Image fileKey audit: document/weighment-image-ref-ddl.sql (SUG_MAI_WEIGHMENT_IMAGE_REF)
app.oracle.erp.retail-order-delivery-require-start=true
# DC HSN / tax from mtl_system_items_b + sug_gst_pkg.get_item_info (SEGMENT1). Broiler strains (e.g. SUNBRO 205F)
# are not item codes; lookup uses BRCULL then any BR* item at the lifting branch that has HSN.
app.oracle.erp.dc-item-code-cull=BRCULL
# Optional dedicated broiler SEGMENT1; if empty, BRCULL / branch live-bird fallback is used
# app.oracle.erp.dc-item-code-broiler=

# V2 mobile API (same service paths as V1; new fields/endpoints backward-compatible unless noted)
app.api.v2.live-readings-required=false
app.api.v2.otp-expires-seconds=300
app.api.v2.otp-resend-max=3
app.api.v2.otp-resend-cooldown-seconds=30
# 0 = no date filter on list. When >0, list includes rows with order_request_date in last N days (NULL date still included).
app.oracle.lifting.package-name=sug_mai_birds_lifting_pkg
app.oracle.lifting.schema-name=APPS
app.oracle.lifting.introspect-on-startup=false
# Keep false for mobile: get_order_status on every start is slow (package introspection + ERP call)
app.oracle.lifting.invoke-order-status-on-start=false

# -------------------------------------------------------------
# File Paths
# -------------------------------------------------------------
file.upload.base-path=${user.home}/weighment
file.upload-dir=${file.upload.base-path}/verification
# Weighment evidence (vehicle, shop, signature)
file.weighment-verification-dir=
file.banner-dir=
pdf.file.path=

# Upload size limits (paths above)
app.weighment.upload.max-image-bytes=5242880
# Legacy path key use file.upload-dir in new environments
app.weighment.upload.base-dir=
# Must be >= app.weighment.upload.max-image-bytes (Spring rejects multipart before the controller otherwise)
spring.servlet.multipart.max-file-size=5242880
spring.servlet.multipart.max-request-size=15728640

# -------------------------------------------------------------
# Swagger
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Disable OpenAPI docs
springdoc.api-docs.enabled=true

# Disable Swagger UI
springdoc.swagger-ui.enabled=true

# -------------------------------------------------------------
# Actuator
# -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
